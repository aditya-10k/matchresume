<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="knot-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="knot-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="knot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc for High Contrast Favicon -->
  <rect width="64" height="64" rx="16" fill="#09090b"/>
  <!-- Decorative Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="#818cf8" opacity="0.15" filter="blur(8px)"/>
  <!-- Interwoven Infinity Knot Path -->
  <g filter="url(#knot-glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loop 1 -->
    <path
      d="M32 15 C20 15, 14 23, 14 32 C14 41, 22 49, 32 49 C42 49, 50 41, 50 32 C50 23, 44 15, 32 15 Z"
      stroke="url(#knot-grad-1)"
      stroke-width="5"
      stroke-dasharray="140"
      stroke-dashoffset="0"
    />
    <!-- Interlaced Figure-Eight / Celtic Crossing -->
    <path
      d="M21 21 C26 26, 38 38, 43 43 M43 21 C38 26, 26 38, 21 43"
      stroke="url(#knot-grad-2)"
      stroke-width="5"
    />
    <!-- Inner Linked Knot Nodes -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  </g>
</svg>