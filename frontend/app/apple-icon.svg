<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="apple-knot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#7000ff"/>
      <stop offset="70%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <radialGradient id="apple-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="apple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#apple-bg)"/>
  <rect width="178" height="178" x="1" y="1" rx="39" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="90" cy="90" r="55" fill="#7000ff" opacity="0.22" filter="blur(20px)"/>
  <g filter="url(#apple-glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Quad Knot Loops -->
    <path
      d="M90 42 C62 42, 46 58, 46 90 C46 122, 62 138, 90 138 C118 138, 134 122, 134 90 C134 58, 118 42, 90 42 Z"
      stroke="url(#apple-knot-grad)"
      stroke-width="13"
    />
    <path
      d="M58 58 C74 74, 106 106, 122 122 M122 58 C106 74, 74 106, 58 122"
      stroke="url(#apple-knot-grad)"
      stroke-width="13"
    />
    <circle cx="90" cy="90" r="8" fill="#ffffff"/>
  </g>
</svg>